<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강서청소년회관 횡스크롤 탈출 : 자정의 메아리</title>
    
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: #1a1c23;
            --primary: #ff5e62;
            --primary-glow: #ff9966;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --danger: #ff4b4b;
        }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh; overflow: hidden; touch-action: none;
        }

        .container {
            width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 { color: var(--primary-glow); margin: 5px 0 10px; font-size: 1.5rem; text-align: center; }
        h2 { font-size: 1.2rem; margin-top: 0; color: #fff; }
        
        .box {
            background: var(--panel-bg); padding: 20px; border-radius: 12px;
            width: 100%; box-sizing: border-box; border: 1px solid #333; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input {
            width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #555; background: #252830; color: white;
            font-size: 1rem; text-align: center; outline: none;
        }
        input:focus { border-color: var(--primary-glow); box-shadow: 0 0 8px rgba(255,153,102,0.5); }

        button {
            width: 100%; padding: 14px; margin-top: 12px;
            background: linear-gradient(45deg, var(--primary), var(--primary-glow));
            color: white; border: none; border-radius: 8px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.97); }

        .story-text { line-height: 1.5; font-size: 0.95rem; text-align: left; margin-bottom: 15px; word-break: keep-all; }
        .story-text span { color: var(--primary-glow); font-weight: bold; }

        /* 🗺️ 횡스크롤 게임 화면 */
        #game-area { display: none; flex-direction: column; align-items: center; width: 100%; }

        .status-bar {
            width: 100%; max-width: 380px; background: rgba(255,255,255,0.05);
            padding: 8px 12px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; box-sizing: border-box; font-weight: bold; border: 1px solid #333;
        }

        #side-canvas {
            width: 380px; height: 250px; background: #15171e;
            border: 3px solid #444; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* 🎮 점프 버튼 패널 */
        .control-panel {
            width: 100%; max-width: 380px; display: flex; justify-content: space-between;
            align-items: center; margin-top: 12px; box-sizing: border-box;
        }

        .jump-btn {
            width: 100%; height: 65px; background: linear-gradient(135deg, #4dabf7, #3b82f6);
            color: white; border: 2px solid #fff; border-radius: 12px; font-size: 1.3rem;
            font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4); user-select: none;
            -webkit-user-select: none; cursor: pointer;
        }
        .jump-btn:active { transform: scale(0.96); background: #2563eb; }

        .footer { margin-top: auto; padding: 10px 0; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>자정의 메아리 : 러닝 탈출</h1>

        <!-- 1. 로그인 화면 -->
        <div id="login-screen" class="box">
            <h2>탐색원 등록</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">이름을 입력하면 고유 캐릭터가 부여됩니다.</p>
            <input type="text" id="player-name" placeholder="참가자 이름 입력" required>
            <button onclick="showIntro()">입장하기</button>
        </div>

        <!-- 2. 인트로 화면 -->
        <div id="intro-screen" class="box" style="display: none;">
            <h2>질주하는 탈출 로드!</h2>
            <div class="story-text">
                시스템 오류로 날아오는 <span>보안 드론과 장애물</span>을 피해 1층 로비까지 끝까지 질주하세요!<br><br>
                ⌨️ <span>스페이스바</span> 또는 화면 아래 <span>[점프] 버튼</span>을 눌러 장애물을 피할 수 있습니다.<br>
                ❤️ 체력은 <span>하트 5개</span>이며, 부딪힐 때마다 반 개씩 깎입니다.
            </div>
            <button onclick="joinGameAndStart()">달리기 시작하기</button>
        </div>

        <!-- 3. 횡스크롤 게임 화면 -->
        <div id="game-area">
            <div class="status-bar">
                <span id="stage-title" style="color: var(--primary-glow);">[3층] 질주 구간</span>
                <span id="hp-display" style="color: #ff4b4b;">❤️❤️❤️❤️❤️</span>
            </div>

            <!-- 2D 횡스크롤 캔버스 -->
            <canvas id="side-canvas" width="380" height="250"></canvas>

            <div class="control-panel">
                <button class="jump-btn" id="btn-jump">👆 점프! (SPACE)</button>
            </div>
        </div>

        <div class="footer">강서청소년회관 &lt;바이브 코딩&gt; 참가자 제작</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVtGfRyA9CaKXU2Ol5sfLA0gK2k4gXn5A",
            authDomain: "gsyouth-exit.firebaseapp.com",
            databaseURL: "https://gsyouth-exit-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "gsyouth-exit",
            storageBucket: "gsyouth-exit.firebasestorage.app",
            messagingSenderId: "683811058406",
            appId: "1:683811058406:web:bdf4f2131580b52b824127",
            measurementId: "G-8XBHWLCQZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SHAPE_POOL = [
            { shape: 'circle', color: '#ff4d4d' },
            { shape: 'rect', color: '#4dabf7' },
            { shape: 'triangle', color: '#00e676' },
            { shape: 'pentagon', color: '#ffd43b' },
            { shape: 'star', color: '#cc5de8' }
        ];

        let myId = ""; 
        let myName = "";
        let allPlayersData = {};
        
        // 🏃‍♂️ 플레이어 물리 및 상태 데이터 (횡스크롤)
        const groundY = 190; // 바닥 높이
        let myState = {
            x: 60,
            y: groundY,
            vy: 0,
            isJumping: false,
            hp: 5.0, // 하트 5개 (반 개 단위: 0.5)
            invincible: 0 // 피격 후 무적 시간 틱
        };

        // 🚧 장애물 시스템 데이터
        let obstacles = [];
        let obstacleTimer = 0;

        const canvas = document.getElementById('side-canvas');
        const ctx = canvas.getContext('2d');

        function showIntro() {
            myName = document.getElementById('player-name').value.trim();
            if (!myName) return alert("이름을 입력해주세요.");
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('intro-screen').style.display = 'block';
        }

        function joinGameAndStart() {
            const randomChar = SHAPE_POOL[Math.floor(Math.random() * SHAPE_POOL.length)];
            const playerRef = db.ref('gameRoom/players').push();
            myId = playerRef.key;

            playerRef.set({
                name: myName,
                x: myState.x,
                y: myState.y,
                color: randomChar.color,
                shape: randomChar.shape,
                hp: 5.0
            });
            playerRef.onDisconnect().remove();

            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';

            startMultiplayer();
        }

        function startMultiplayer() {
            // 1. 실시간 플레이어 데이터 수신 (동시 접속)
            db.ref('gameRoom/players').on('value', (snapshot) => {
                allPlayersData = snapshot.val() || {};
            });

            setupControls();
            requestAnimationFrame(gameLoop);
        }

        // --- 🕹️ 점프 조작 세팅 ---
        function setupControls() {
            window.addEventListener('keydown', e => {
                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    triggerJump();
                }
            });

            const jumpBtn = document.getElementById('btn-jump');
            const handleJump = (e) => {
                e.preventDefault();
                triggerJump();
            };
            jumpBtn.addEventListener('touchstart', handleJump, { passive: false });
            jumpBtn.addEventListener('mousedown', handleJump);
        }

        function triggerJump() {
            if (!myState.isJumping && myState.hp > 0) {
                myState.vy = -10.5; // 점프 힘
                myState.isJumping = true;
            }
        }

        // --- 🔄 메인 프레임 루프 (60FPS 게임엔진) ---
        let lastSyncTime = 0;

        function gameLoop() {
            if (myState.hp > 0) {
                // 물리 엔진: 중력 적용
                myState.vy += 0.55;
                myState.y += myState.vy;

                // 바닥 착지 체크
                if (myState.y >= groundY) {
                    myState.y = groundY;
                    myState.vy = 0;
                    myState.isJumping = false;
                }

                // 무적 시간 감소
                if (myState.invincible > 0) myState.invincible--;

                // 장애물 생성 (일정 주기마다)
                obstacleTimer++;
                if (obstacleTimer > 90 + Math.random() * 50) { // 무작위 간격
                    obstacles.push({ x: 380, y: groundY - 15, w: 20, h: 25, speed: 4.5 });
                    obstacleTimer = 0;
                }

                // 장애물 이동 및 충돌 판정
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= obstacles[i].speed;

                    // 화면 밖으로 나간 장애물 제거
                    if (obstacles[i].x < -30) {
                        obstacles.splice(i, 1);
                        continue;
                    }

                    // AABB 충돌 체크 (내 캐릭터와 장애물)
                    // 캐릭터 위치: (myState.x, myState.y - 12) 크기 24x24 박스
                    if (myState.invincible === 0 &&
                        myState.x - 12 < obstacles[i].x + obstacles[i].w &&
                        myState.x + 12 > obstacles[i].x &&
                        (myState.y - 24) < obstacles[i].y + obstacles[i].h &&
                        myState.y > obstacles[i].y) {
                        
                        // 충돌 시 하트 0.5개 (반 개) 차감
                        myState.hp = Math.max(0, myState.hp - 0.5);
                        myState.invincible = 45; // 45프레임 동안 무적 (깜빡임 효과 유도)
                    }
                }

                // 💡 내 위치 및 체력을 Firebase 서버로 실시간 동기화
                if (Date.now() - lastSyncTime > 35) {
                    db.ref('gameRoom/players/' + myId).update({
                        y: myState.y,
                        hp: myState.hp
                    });
                    lastSyncTime = Date.now();
                }
            }

            // 하트 UI 텍스트 렌더링
            updateHpUI();

            // 캔버스 그리기
            drawSideScrollMap();
            requestAnimationFrame(gameLoop);
        }

        function updateHpUI() {
            let fullHearts = Math.floor(myState.hp);
            let hasHalf = (myState.hp % 1 !== 0);
            let heartStr = "❤️".repeat(fullHearts) + (hasHalf ? "💔" : "") + "🖤".repeat(5 - Math.ceil(myState.hp));
            document.getElementById('hp-display').innerText = heartStr;
        }

        // --- 🎨 횡스크롤 캔버스 렌더링 ---
        function drawSideScrollMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 배경 (복도 느낌의 선)
            ctx.strokeStyle = "#2e3240";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, groundY + 12); ctx.lineTo(380, groundY + 12);
            ctx.stroke();

            // 바닥 그리기
            ctx.fillStyle = "#1e222d";
            ctx.fillRect(0, groundY + 12, canvas.width, canvas.height - (groundY + 12));

            // 2. 장애물(드론) 그리기
            ctx.fillStyle = "#ff4b4b";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            }

            // 3. 서버에 접속한 모든 플레이어 렌더링 (동시 접속자 확인용)
            Object.keys(allPlayersData).forEach(key => {
                const p = allPlayersData[key];
                if (p.y !== undefined) {
                    // 내가 피격당했을 때 깜빡이는 효과 (무적 시간 동안)
                    if (key === myId && myState.invincible > 0 && Math.floor(myState.invincible / 4) % 2 === 0) {
                        return; // 깜빡임 연출을 위해 스킵
                    }

                    drawShape(myState.x, p.y, p.color, p.shape); // X는 고정, Y는 각자의 점프 상태 반영

                    // 이름 및 체력 표시
                    ctx.fillStyle = "white";
                    ctx.font = "bold 10px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(p.name, myState.x, p.y - 20);
                }
            });

            // 게임 오버 처리
            if (myState.hp <= 0) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4b4b";
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "white";
                ctx.font = "13px sans-serif";
                ctx.fillText("새로고침하여 다시 도전하세요!", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        // --- 📐 도형 렌더링 함수 ---
        function drawShape(x, y, color, shape) {
            ctx.fillStyle = color;
            ctx.beginPath();
            if (shape === 'circle') {
                ctx.arc(x, y, 12, 0, Math.PI * 2);
            } else if (shape === 'rect') {
                ctx.rect(x - 12, y - 12, 24, 24);
            } else if (shape === 'triangle') {
                ctx.moveTo(x, y - 14); ctx.lineTo(x - 12, y + 10); ctx.lineTo(x + 12, y + 10); ctx.closePath();
            } else if (shape === 'pentagon') {
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
                    const px = x + 13 * Math.cos(angle);
                    const py = y + 13 * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
            } else if (shape === 'star') {
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 14 + x, -Math.sin((18 + i * 72) * Math.PI / 180) * 14 + y);
                    ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 6 + x, -Math.sin((54 + i * 72) * Math.PI / 180) * 6 + y);
                }
                ctx.closePath();
            }
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    </script>
</body>
</html>
