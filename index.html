<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강서청소년회관 방탈출 : 실시간 동기화</title>
    
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg-dark: #121212; --primary: #ff5e62; --primary-glow: #ff9966; --text-main: #f0f0f0; --panel: #1e1e1e; }
        body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Pretendard', sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: var(--primary); }
        .box { background: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: white; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--primary), var(--primary-glow)); color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .player-list { display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .player-item { padding: 10px; background: #333; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .ready { color: #00e676; font-weight: bold; }
        
        /* 접속자 수 카운터 스타일 */
        .count-badge {
            display: inline-block;
            background: rgba(255, 153, 102, 0.2);
            color: var(--primary-glow);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            border: 1px solid var(--primary-glow);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>자정의 메아리</h1>
        
        <!-- 1. 접속 화면 -->
        <div id="login-screen" class="box">
            <h2>역할 선택 및 접속</h2>
            <input type="text" id="player-name" placeholder="이름을 입력하세요" required>
            <select id="player-role">
                <option value="p1">온에어 디렉터 (3층)</option>
                <option value="p2">행정 마스터 (2층)</option>
                <option value="p3">아지트 탐험가 (지하)</option>
                <option value="p4">AI 제어자 (1층)</option>
                <option value="p5">스마트짐 마스터 (최종)</option>
            </select>
            <button onclick="joinGame()">접속하기</button>
        </div>

        <!-- 2. 대기실 화면 (동기화) -->
        <div id="lobby-screen" class="box" style="display: none;">
            <h2>실시간 참가자 현황</h2>
            
            <!-- 💡 실시간 접속자 수 표시 영역 추가 -->
            <div class="count-badge" id="player-count">현재 접속자: 0 / 5명</div>

            <div class="player-list" id="players-display">
                <!-- 참가자 목록이 실시간으로 갱신되는 영역 -->
            </div>
            <br>
            <button id="ready-btn" onclick="toggleReady()">준비 완료</button>
        </div>
    </div>

    <script>
        // 🚨 중요: 여기에 본인의 Firebase 설정값을 다시 붙여넣으세요!
        const firebaseConfig = {
            apiKey: "본인의_API_KEY",
            authDomain: "본인의_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://본인의_PROJECT_ID-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "본인의_PROJECT_ID",
            storageBucket: "본인의_PROJECT_ID.appspot.com",
            messagingSenderId: "본인의_SENDER_ID",
            appId: "본인의_APP_ID"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myRole = ""; 
        let isReady = false;

        function joinGame() {
            const name = document.getElementById('player-name').value.trim();
            myRole = document.getElementById('player-role').value;

            if (!name) return alert("이름을 입력해주세요.");

            db.ref('gameRoom/players/' + myRole).set({
                name: name,
                ready: false
            });

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';

            startSync();
        }

        function startSync() {
            const playersRef = db.ref('gameRoom/players');
            
            playersRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let displayHtml = "";
                let count = 0; // 💡 접속자 수 계산 변수
                
                if (data) {
                    count = Object.keys(data).length; // 등록된 데이터(역할)의 개수를 셈
                    
                    Object.keys(data).forEach(key => {
                        const p = data[key];
                        const status = p.ready ? "<span class='ready'>[준비 완료]</span>" : "[대기 중]";
                        displayHtml += `<div class="player-item">
                            <span><strong>${p.name}</strong> (${key})</span>
                            ${status}
                        </div>`;
                    });
                }
                
                // 💡 접속자 수 UI 업데이트
                document.getElementById('player-count').innerText = `현재 접속자: ${count} / 5명`;
                document.getElementById('players-display').innerHTML = displayHtml;
            });
        }

        function toggleReady() {
            isReady = !isReady;
            db.ref('gameRoom/players/' + myRole).update({
                ready: isReady
            });
            
            const btn = document.getElementById('ready-btn');
            btn.innerText = isReady ? "준비 취소" : "준비 완료";
            btn.style.background = isReady ? "#444" : "linear-gradient(45deg, var(--primary), var(--primary-glow))";
        }
    </script>
</body>
</html>
