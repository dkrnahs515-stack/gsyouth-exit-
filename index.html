<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>강서청소년회관 방탈출 : 실시간 동기화</title>
    
    <!-- Firebase SDK 로드 (호환성 버전) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg-dark: #121212; --primary: #ff5e62; --text-main: #f0f0f0; --panel: #1e1e1e; }
        body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Pretendard', sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: var(--primary); }
        .box { background: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        input, select { width: 90%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: white; font-size: 1rem; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        button:active { transform: scale(0.98); }
        .player-list { display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .player-item { padding: 10px; background: #333; border-radius: 6px; display: flex; justify-content: space-between; }
        .ready { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>자정의 메아리 (동기화 테스트)</h1>
        
        <!-- 1. 접속 화면 -->
        <div id="login-screen" class="box">
            <h2>역할 선택 및 접속</h2>
            <input type="text" id="player-name" placeholder="이름을 입력하세요" required>
            <select id="player-role">
                <option value="p1">온에어 디렉터 (3층)</option>
                <option value="p2">행정 마스터 (2층)</option>
                <option value="p3">아지트 탐험가 (지하)</option>
                <option value="p4">AI 제어자 (1층)</option>
                <option value="p5">스마트짐 마스터 (최종)</option>
            </select>
            <button onclick="joinGame()">접속하기</button>
        </div>

        <!-- 2. 대기실 화면 (동기화) -->
        <div id="lobby-screen" class="box" style="display: none;">
            <h2>실시간 참가자 현황</h2>
            <div class="player-list" id="players-display">
                <!-- 참가자 목록이 실시간으로 갱신되는 영역 -->
            </div>
            <br>
            <button id="ready-btn" onclick="toggleReady()">준비 완료</button>
        </div>
    </div>

    <script>
        // 🚨 중요: 여기에 본인의 Firebase 설정값을 붙여넣으세요!
        const firebaseConfig = {
            apiKey: "AIzaSyAVtGfRyA9CaKXU2Ol5sfLA0gK2k4gXn5A",
            authDomain: "gsyouth-exit.firebaseapp.com",
            databaseURL: "https://gsyouth-exit-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "gsyouth-exit",
            storageBucket: "gsyouth-exit.firebasestorage.app.appspot.com",
            messagingSenderId: "683811058406",
            appId: "1:683811058406:web:bdf4f2131580b52b824127"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myRole = ""; 
        let isReady = false;

        // 1. 게임 접속 함수
        function joinGame() {
            const name = document.getElementById('player-name').value.trim();
            myRole = document.getElementById('player-role').value;

            if (!name) return alert("이름을 입력해주세요.");

            // Firebase에 내 정보 쓰기
            db.ref('gameRoom/players/' + myRole).set({
                name: name,
                ready: false
            });

            // 화면 전환
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'block';

            // 실시간 데이터 수신 시작
            startSync();
        }

        // 2. 실시간 동기화 함수
        function startSync() {
            const playersRef = db.ref('gameRoom/players');
            
            // 데이터베이스의 값이 변경될 때마다 자동으로 실행됨 (핵심 기능)
            playersRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let displayHtml = "";
                
                if (data) {
                    // 서버에 등록된 플레이어들을 화면에 그림
                    Object.keys(data).forEach(key => {
                        const p = data[key];
                        const status = p.ready ? "<span class='ready'>[준비 완료]</span>" : "[대기 중]";
                        displayHtml += `<div class="player-item">
                            <span>${p.name} (${key})</span>
                            ${status}
                        </div>`;
                    });
                }
                document.getElementById('players-display').innerHTML = displayHtml;
            });
        }

        // 3. 준비 버튼 클릭 (내 상태 변경)
        function toggleReady() {
            isReady = !isReady;
            // 내 역할의 ready 값을 Firebase에 업데이트
            db.ref('gameRoom/players/' + myRole).update({
                ready: isReady
            });
            
            const btn = document.getElementById('ready-btn');
            btn.innerText = isReady ? "준비 취소" : "준비 완료";
            btn.style.background = isReady ? "#444" : "var(--primary)";
        }
    </script>
</body>
</html>
